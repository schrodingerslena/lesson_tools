<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prism Volume and Lateral Area</title>
<style>
body{font:18px system-ui;background:#eff5f4;color:#18323d;margin:0}main{max-width:900px;margin:auto;padding:20px}button{font:inherit;padding:10px 14px;margin:4px;border:1px solid #819a9b;border-radius:9px;background:white;color:inherit}button[aria-pressed=true]{background:#185c56;color:white}svg{width:100%;display:block;background:white;border-radius:16px;margin-top:12px}a{color:#185c56}#readout{font-weight:650}
</style>
<main>
<a href="./">← Geometry Lab</a>
<h1>Prism Volume and Lateral Area</h1>
<nav aria-label="Demonstration"><button id="volume">Stack layers</button><button id="strip">Unwrap the sides</button></nav>
<div id="controls"></div>
<svg id="diagram" viewBox="0 -70 640 420" role="img" aria-label="Prism demonstration"></svg>
<p id="readout" aria-live="polite"></p>
<p id="guide"></p>
</main>
<script>
const el=id=>document.getElementById(id);
let mode='volume',layers=0,roll=0,rolling=false;
const colors=['#176b99','#a34c11','#2b7243','#884a99'];
const lengths=[4,3,4,3];
const star=Array.from({length:10},(_,i)=>{
  const angle=-Math.PI/2+i*Math.PI/5;
  const radius=i%2?1.4:3;
  return [radius*Math.cos(angle),radius*Math.sin(angle)];
});
const starArea=Math.abs(star.reduce((sum,[x,y],i)=>{
  const [a,b]=star[(i+1)%star.length];
  return sum+x*b-y*a;
},0))/2;
const starScale=Math.sqrt(12/starArea);
const polygon=(points,fill)=>'<polygon points="'+points.map(p=>p.join(',')).join(' ')+'" fill="'+fill+'" stroke="#365c60" stroke-width="1.5"/>';
const line=(a,b,color,width=2)=>'<path d="M'+a.join(' ')+' L'+b.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="'+width+'"/>';
const label=(x,y,value)=>'<text x="'+x+'" y="'+y+'" text-anchor="middle" fill="#18323d" font-size="17">'+value+'</text>';
function stack(){
  const project=([x,y],z)=>[275+starScale*(43*x-15*y),242+starScale*(8*x+24*y)-37*z];
  const at=z=>star.map(p=>project(p,z));
  let svg=polygon(at(0),'#f2aebe');
  for(let i=0;i<layers;i++){
    const lower=at(i),upper=at(i+1);
    for(let a=0;a<star.length;a++){
      const b=(a+1)%star.length;
      if(lower[b][0]<=lower[a][0])continue;
      svg+=polygon([lower[a],lower[b],upper[b],upper[a]],i%2?'#c96c89':'#e491a9');
    }
    svg+=polygon(upper,'#f2aebe');
  }
  const bottom=242,top=bottom-37*layers;
  svg+=line([437,bottom],[437,top],'#185c56');
  for(const y of [bottom,top])svg+=line([428,y],[446,y],'#185c56');
  return svg+label(526,(bottom+top)/2+6,'Height = '+layers+' cm');
}
function unwrap(){
  const unit=34,y=150,x0=75,depth=68;
  let x=x0,svg='';
  lengths.forEach((length,i)=>{
    const next=x+length*unit;
    svg+=polygon([[x,y],[next,y],[next,y+depth],[x,y+depth]],'#e4efef');
    svg+=line([x,y],[next,y],colors[i],roll>=i?6:3);
    svg+=label((x+next)/2,y+35,length+' cm');
    x=next;
  });
  const w=4*unit,h=3*unit;
  svg+=polygon([[x0,y+depth],[x0+w,y+depth],[x0+w,y+depth+h],[x0,y+depth+h]],'#d9efea');
  svg+=label(x0+w/2,y+depth+h/2,'Other base');
  const origin=[[x0,y],[x0+w,y],[x0+w,y-h],[x0,y-h]];
  if(roll>0)svg+=polygon(origin,'#e7f4f0');
  const turn=Math.floor(roll);
  const pivot=lengths.slice(0,turn+1).reduce((sum,n)=>sum+n,0)*unit+x0;
  const left=x0+lengths.slice(0,turn).reduce((sum,n)=>sum+n,0)*unit;
  const width=lengths[turn%4]*unit,height=lengths[(turn+1)%4]*unit;
  const angle=(roll-turn)*Math.PI/2;
  const rotate=([a,b])=>[pivot+(a-pivot)*Math.cos(angle)-(b-y)*Math.sin(angle),y+(a-pivot)*Math.sin(angle)+(b-y)*Math.cos(angle)];
  const points=[[left,y],[left+width,y],[left+width,y-height],[left,y-height]].map(rotate);
  svg+=polygon(points,'#8bd3c7');
  for(let i=0;i<4;i++)svg+=line(points[i],points[(i+1)%4],colors[(turn+i)%4],4);
  return svg;
}
function rollNext(){
  if(rolling||roll>=3)return;
  rolling=true;
  const from=roll,start=performance.now();
  function frame(now){
    const part=Math.min(1,(now-start)/550);
    roll=from+part;
    if(mode==='strip')el('diagram').innerHTML=unwrap();
    if(part<1)requestAnimationFrame(frame);
    else{rolling=false;render();if(mode==='strip')(el('roll').disabled?el('again'):el('roll')).focus();}
  }
  requestAnimationFrame(frame);
}
function render(){
  const volume=mode==='volume';
  el('volume').setAttribute('aria-pressed',volume);
  el('strip').setAttribute('aria-pressed',!volume);
  el('controls').innerHTML=volume
    ? '<button id="add" '+(layers===5?'disabled':'')+'>Add 1 cm layer</button><button id="reset">Start over</button>'
    : '<button id="roll" '+(roll>=3?'disabled':'')+'>Roll to next edge</button><button id="again">Start over</button>';
  el('diagram').innerHTML=volume?stack():unwrap();
  el('readout').textContent=volume?(layers?'12 cm² × '+layers+' cm = '+12*layers+' cm³':'Star base area = 12 cm²'):roll===3?'Base perimeter = strip length = 4 + 3 + 4 + 3 = 14 cm':'Edges matched: '+(Math.floor(roll)+1)+' of 4';
  el('guide').textContent=volume?'Each layer is 1 cm thick. Volume = base area × height.':'Watch each coloured base edge land on the matching edge of the net.';
  if(volume){el('add').onclick=()=>{layers++;render();(el('add').disabled?el('reset'):el('add')).focus()};el('reset').onclick=()=>{layers=0;render();el('add').focus()};}
  else{
    el('roll').onclick=rollNext;
    el('again').onclick=()=>{if(!rolling){roll=0;render();el('roll').focus();}};
  }
}
el('volume').onclick=()=>{mode='volume';render()};
el('strip').onclick=()=>{mode='strip';render()};
render();
</script>
</html>
