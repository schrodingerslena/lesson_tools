<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometry Lab</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#213a3d;background:#f5f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:26px;margin:4px 0}small,.muted{color:#698080}button,select,input,textarea{font:inherit}button,select{border:1px solid #d5dfdc;background:white;border-radius:9px;padding:10px 15px;color:inherit;cursor:pointer}button.active,button.primary{background:#246b60;color:white;border-color:#246b60}button:disabled{opacity:.4;cursor:default}nav{display:flex;gap:6px;margin:26px 0 18px}.layout{display:grid;grid-template-columns:1fr 310px;gap:20px}.stage,.panel,.task{background:white;border:1px solid #e0e7e3;border-radius:18px}.stage{overflow:hidden}.toolbar{padding:18px;display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid #edf1ee}.canvas{position:relative}svg{width:100%;height:425px;display:block;touch-action:none}.caption{text-align:center;padding:0 14px 18px;color:#698080;font-size:13px}.panel{padding:22px}h2{font-size:19px;margin:0 0 16px}label{display:block;margin:17px 0 7px;font-size:13px;font-weight:600}input[type=range]{width:100%;accent-color:#246b60}input[type=checkbox]{accent-color:#246b60}textarea,input[type=number]{width:100%;padding:10px;border:1px solid #d5dfdc;border-radius:8px}textarea{min-height:70px;resize:vertical}.task{padding:20px 24px;margin-bottom:20px}.task p{margin:8px 0;line-height:1.5}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{color:#246b60;background:#eaf4ed;border-radius:20px;padding:5px 10px;font-size:12px}.footer{margin-top:22px;display:flex;justify-content:space-between;align-items:center}details{margin-top:22px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:9px;border-bottom:1px solid #e1e8e4;text-align:left}.feedback{background:#eef5ef;padding:12px;border-radius:8px;margin-top:10px;font-size:14px;line-height:1.5}.hidden{display:none!important}.count{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.legend{font-size:13px;line-height:1.9}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.sectionThumb{height:110px}a{color:#246b60}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #dcad54;outline-offset:2px}.type-options{display:grid;gap:8px}.type-options button{text-align:left;min-height:48px}.type-options button.active{box-shadow:0 0 0 2px #246b6020}.type-options button.active::after{content:"✓";float:right}button{min-height:44px}@media(max-width:800px){main{padding:16px}.layout{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}svg{height:340px}.panel{padding:18px}}
