<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Variation Questions</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#20343b;font-family:Arial,sans-serif}main{max-width:1000px;margin:70px auto;padding:24px}nav{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #dce3e4;padding-bottom:24px}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:13px 17px;color:#344e53;background:transparent}button[aria-pressed=true]{background:#e0eeea;color:#195e50}#next{background:#205f52;color:white}#question{font-size:26px;line-height:1.9;padding:40px 0;min-height:230px}i{font-family:Georgia,serif}button:focus-visible{outline:3px solid #75af9f;outline-offset:3px}@media(max-width:600px){main{margin:16px auto;padding:18px}#question{font-size:22px}nav button{padding:10px;font-size:14px}}</style><main><nav aria-label="Variation type"><button data-type="direct" aria-pressed="true">Direct variation</button><button data-type="inverse" aria-pressed="false">Inverse variation</button><button data-type="joint" aria-pressed="false">Joint variation</button><button data-type="partly" aria-pressed="false">Partial variation</button></nav><div id="question" aria-live="polite"></div><button id="next">Next question</button></main><script>
const pick=a=>a[Math.floor(Math.random()*a.length)],v=s=>'<i>'+s+'</i>';let type='direct',previous='';
const join=a=>a.length<3?a.join(' and '):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
function generate(){
let letters=['a','b','c','p','q','r','x','y','z','u','t','s'];
for(let i=letters.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[letters[i],letters[j]]=[letters[j],letters[i]]}
let y=letters.pop(),count=type==='joint'?pick([2,3]):type==='partly'?1:pick([1,1,1,2,3]);
let terms=Array.from({length:count},()=>{let letter=letters.pop(),power=pick(count>1?[1,1,.5,2]:[1,1,.5,2,3]);return{letter,power,words:power===1?v(letter):power===.5?'the square root of '+v(letter):'the '+(power===2?'square':'cube')+' of '+v(letter)}});
let samples=terms.map(t=>{let n=pick([2,3,4]);return{input:t.power===.5?n*n:n,value:t.power===.5?n:n**t.power}});
let product=samples.reduce((a,b)=>a*b.value,1),k=pick([1,2,3,4,5,6,.5,1.5]),offset=pick([2,3,4,5,6,8,10]);
if(type==='inverse')k=product*pick([1,2,3]);
let out=type==='inverse'?k/product:k*product+(type==='partly'?offset:0);
let expression=count===1?terms[0].words:'the product of '+join(terms.map(t=>t.words));
let relation=type==='direct'?'varies directly as '+expression:type==='inverse'?'varies inversely as '+expression:type==='joint'?'varies jointly as '+join(terms.map(t=>t.words)):'is partly constant and partly varies directly as '+expression;
let observation=samples.map((s,i)=>v(terms[i].letter)+' = '+s.input).join(', ')+', '+v(y)+' = '+out;
let text='It is given that '+v(y)+' '+relation+'. When '+observation+'. ';
if(type==='partly'){let t=terms[0],n=pick([5,6]),input=t.power===.5?n*n:n,value=t.power===.5?n:n**t.power;text+='When '+v(t.letter)+' = '+input+', '+v(y)+' = '+(offset+k*value)+'. '}
return text+'Express '+v(y)+' in terms of '+join(terms.map(t=>v(t.letter)))+'.';
}
function next(){let text;do{text=generate()}while(text===previous);previous=text;document.getElementById('question').innerHTML=text}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));next()});document.getElementById('next').onclick=next;next();
</script></html>
